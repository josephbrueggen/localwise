# Twice-weekly keep-awake ping for the site. Uses no secrets.
name: Keep-awake ping

on:
  schedule:
    - cron: "17 14 * * 1,4" # Mondays and Thursdays, 14:17 UTC
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the site
        run: curl --fail --silent --show-error --max-time 30 https://localwise-79q.pages.dev/api/keepalive
