# Keeps the free Supabase project awake (it pauses after about a week
# without activity). Free for public repositories; uses no secrets.
# It calls the site's /api/keepalive endpoint, which reads zero rows.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 * * 1,4" # Mondays and Thursdays, 14:17 UTC
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the site
        run: curl --fail --silent --show-error --max-time 30 https://localwise-79q.pages.dev/api/keepalive
